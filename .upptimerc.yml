owner: netzpixel
repo: manyscreens-status

# ponytail: three checks cover what a user hits — the site, the server behind it, the relay
sites:
  - name: Website
    url: https://manyscreens.com/
  - name: Server
    url: https://manyscreens.com/healthz
  - name: Relay (TURN over TLS, port 443)
    check: tcp-ping
    url: turn.manyscreens.com
    port: 443

status-website:
  cname: status.manyscreens.com
  logoUrl: https://manyscreens.com/icon-192.png
  name: ManyScreens Status
  introTitle: "**ManyScreens** — is it up?"
  introMessage: Checked every five minutes from GitHub. An incident here opens an issue in [this repository](https://github.com/netzpixel/manyscreens-status/issues).
  navbar:
    - title: Status
      href: /
    - title: manyscreens.com
      href: https://manyscreens.com/
